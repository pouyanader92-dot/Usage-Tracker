name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip and apply updates
        run: |
          unzip -q UsageTracker.zip
          cp -f *.kt UsageTracker/app/src/main/java/com/example/usagetracker/ 2>/dev/null || true
          for f in update*.zip; do
            [ -e "$f" ] || continue
            unzip -oq "$f" -d UsageTracker
          done
      - run: gradle assembleDebug --no-daemon
        working-directory: UsageTracker
      - name: Save APK in repo
        run: |
          cp UsageTracker/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app-debug.apk
          git commit -m "Update APK [skip ci]" || echo "no changes"
          git push
