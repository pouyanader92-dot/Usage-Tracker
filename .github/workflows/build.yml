name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip and apply updated files
        run: |
          unzip -q UsageTracker.zip
          cp -f *.kt UsageTracker/app/src/main/java/com/example/usagetracker/ 2>/dev/null || true
      - run: gradle assembleDebug --no-daemon
        working-directory: UsageTracker
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: UsageTracker/app/build/outputs/apk/debug/app-debug.apk
