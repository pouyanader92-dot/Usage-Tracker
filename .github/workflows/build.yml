name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip and apply updates
        run: |
          unzip -q UsageTracker.zip
          cp -f *.kt UsageTracker/app/src/main/java/com/example/usagetracker/ 2>/dev/null || true
          for f in $(ls update*.zip 2>/dev/null | sort -V); do
            unzip -oq "$f" -d UsageTracker
          done
      - name: Build
        working-directory: UsageTracker
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        working-directory: UsageTracker
        run: |
          {
            echo '### Compile errors'
            echo '```'
            grep -E '^e: |What went wrong' -A2 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save APK in repo
        run: |
          cp UsageTracker/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app-debug.apk
          git commit -m "Update APK [skip ci]" || echo "no changes"
          git push
